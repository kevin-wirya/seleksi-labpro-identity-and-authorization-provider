services:
  db:
    image: postgres:15-alpine
    container_name: primary_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: sso_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sso_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  broker:
    image: rabbitmq:3-management-alpine
    container_name: message_broker
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 3

  auth-provider:
    build:
      context: ./auth-provider/server
    container_name: auth_provider_server
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://admin:secret@db:5432/sso_db?schema=public
      RABBITMQ_URL: amqp://guest:guest@broker:5672
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy

  outbox-publisher:
    build:
      context: ./auth-provider/server
    container_name: outbox_publisher
    command: node src/publisher.js
    environment:
      DATABASE_URL: postgresql://admin:secret@db:5432/sso_db?schema=public
      RABBITMQ_URL: amqp://guest:guest@broker:5672
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy

  sync-worker:
    build:
      context: ./auth-provider/server
    container_name: sync_worker
    command: node src/worker.js
    environment:
      DATABASE_URL: postgresql://admin:secret@db:5432/sso_db?schema=public
      RABBITMQ_URL: amqp://guest:guest@broker:5672
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy

  app-a:
    build:
      context: ./applications/app-a
    container_name: app_a
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://admin:secret@db:5432/sso_db?schema=public
    depends_on:
      db:
        condition: service_healthy

  app-b:
    build:
      context: ./applications/app-b
    container_name: app_b
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://admin:secret@db:5432/sso_db?schema=public
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: